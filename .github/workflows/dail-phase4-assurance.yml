name: DAIL Phase 4 Assurance (Bounded)

on:
  pull_request:
    paths:
      - "migrations/**"
      - "services/dail_v1/**"
      - "scripts/*dail*"
      - "tests/test_dail*.py"
      - "tests/test_chlom_mesh*_hardening.py"
      - "tests/test_verify_dail_lineage_snapshot.py"
      - "registry/core.yaml"
      - "registry/components.yaml"
      - "registry/roadmap.yaml"
      - "developers/manifests/dail-phase4-assurance.v1.json"
      - "docs/architecture/DAIL_PHASE4_ASSURANCE.md"
      - "artifacts/receipts/dail-*"
      - "recovery/dail_v1/**"
      - "supabase/functions/chlom-mesh-status/**"
      - "supabase/functions/chlom-mesh-control/**"
      - "requirements-dev.txt"
      - ".github/workflows/dail-phase4-assurance.yml"
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "services/dail_v1/**"
      - "scripts/*dail*"
      - "tests/test_dail*.py"
      - "tests/test_chlom_mesh*_hardening.py"
      - "tests/test_verify_dail_lineage_snapshot.py"
      - "registry/core.yaml"
      - "registry/components.yaml"
      - "registry/roadmap.yaml"
      - "developers/manifests/dail-phase4-assurance.v1.json"
      - "docs/architecture/DAIL_PHASE4_ASSURANCE.md"
      - "artifacts/receipts/dail-*"
      - "recovery/dail_v1/**"
      - "supabase/functions/chlom-mesh-status/**"
      - "supabase/functions/chlom-mesh-control/**"
      - "requirements-dev.txt"
      - ".github/workflows/dail-phase4-assurance.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Registry and unit assurance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development requirements
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate governed registry
        run: |
          set -Eeuo pipefail
          python scripts/validate_registry.py

      - name: Run full unit test discovery
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v

  public-status-route-smoke:
    name: Public v2 read-service contract smoke
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Probe sanitized CHLOM mesh status
        env:
          STATUS_URL: https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/chlom-mesh-status
        run: |
          set -Eeuo pipefail

          response_file="${RUNNER_TEMP}/chlom-mesh-status.json"
          http_status="$(
            curl \
              --silent \
              --show-error \
              --retry 2 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize 262144 \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              "${STATUS_URL}"
          )"

          if [[ "${http_status}" != "200" ]]; then
            echo "CHLOM mesh status returned HTTP ${http_status}; expected 200" >&2
            exit 1
          fi

          python scripts/verify_dail_mesh_status.py \
            "${response_file}" \
            --summary-file "${GITHUB_STEP_SUMMARY}"
