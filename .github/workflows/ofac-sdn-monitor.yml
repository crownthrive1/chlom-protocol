name: OFAC SDN Feed Monitor

on:
  schedule:
    # OFAC's list can change outside a predictable cadence; poll four times daily.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ofac-sdn-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Monitor OFAC SDN Advanced XML
        id: monitor
        run: python scripts/ofac_sdn_monitor.py --state-file registry/ofac_sdn_feed_state.json

      - name: Preserve durable pending-review signal when the source changes
        if: steps.monitor.outputs.changed == 'true'
        env:
          SDN_SHA256: ${{ steps.monitor.outputs.sha256 }}
          PUBLISHED_DATE: ${{ steps.monitor.outputs.published_date }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          value = {
              "schema": "ct.chlom.ofac-sdn-review-signal.v1",
              "state": "pending_human_review",
              "source": "U.S. Treasury / OFAC Sanctions List Service",
              "dataset": "Specially Designated Nationals (SDN) — Advanced XML",
              "source_url": "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN_ADVANCED.XML",
              "dataset_sha256": os.environ["SDN_SHA256"],
              "published_date": os.environ.get("PUBLISHED_DATE") or None,
              "detected_at_utc": datetime.now(timezone.utc).isoformat(),
              "detection_run": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "automatic_sanctions_determination": False,
              "human_review_required": True,
              "note": "A source-feed change is a compliance review signal only. It is not an automatic sanctions determination about any person, customer, transaction, or asset.",
          }
          Path("registry/ofac_sdn_watch_pending.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Commit feed state and review signal when the source changes
        if: steps.monitor.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/ofac_sdn_feed_state.json registry/ofac_sdn_watch_pending.json
          git commit -m "chore(compliance): record OFAC SDN feed change"
          git push

      - name: Publish compliance watch issue when repository Issues are enabled
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SDN_SHA256: ${{ steps.monitor.outputs.sha256 }}
          PUBLISHED_DATE: ${{ steps.monitor.outputs.published_date }}
        shell: bash
        run: |
          set -euo pipefail
          issues_enabled="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues')"
          if [[ "$issues_enabled" != "true" ]]; then
            {
              echo "## OFAC SDN feed change preserved"
              echo
              echo "Repository Issues are disabled, so no issue was opened."
              echo "The durable pending-review signal is registry/ofac_sdn_watch_pending.json."
              echo "Human review remains required; no automatic sanctions determination was made."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat > /tmp/ofac-sdn-change.md <<EOF
          ## OFAC SDN feed change detected

          The automated CHLOM monitor detected a new OFAC Specially Designated Nationals (SDN) Advanced XML dataset.

          - Source: https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN_ADVANCED.XML
          - Published date: ${PUBLISHED_DATE:-not reported}
          - SHA-256: ${SDN_SHA256}
          - Detection workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Durable review signal: registry/ofac_sdn_watch_pending.json

          **Important:** This event is a compliance signal, not an automatic determination that a CrownThrive customer, person, transaction, or asset is sanctioned. Screening systems must evaluate the updated authoritative dataset under their applicable policies and human review controls.
          EOF
          gh issue create \
            --title "OFAC SDN feed changed — review required" \
            --body-file /tmp/ofac-sdn-change.md
