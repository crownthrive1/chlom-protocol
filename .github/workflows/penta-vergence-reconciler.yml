name: PentaVergence Repository Worker
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read
  id-token: write
concurrency:
  group: penta-vergence-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Claim PentaBase convergence job
        id: claim
        env: {BRIDGE: 'https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/penta-vergence-bridge'}
        run: |
          set -euo pipefail
          OIDC=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=penta-vergence" | jq -r .value)
          printf '%s' "$OIDC" > oidc.token; chmod 600 oidc.token
          curl -fsSL -H "Authorization: Bearer ${OIDC}" -H 'Content-Type: application/json' -d '{"action":"claim"}' "$BRIDGE" > claim.json
          echo "claimed=$(jq -r '.job.claimed // false' claim.json)" >> "$GITHUB_OUTPUT"
          echo "job_id=$(jq -r '.job.job_id // empty' claim.json)" >> "$GITHUB_OUTPUT"
          echo "mode=$(jq -r '.job.mode // empty' claim.json)" >> "$GITHUB_OUTPUT"
      - name: Reconcile pull requests
        if: steps.claim.outputs.claimed == 'true'
        env: {GH_TOKEN: '${{ github.token }}', MODE: '${{ steps.claim.outputs.mode }}'}
        run: |
          set -euo pipefail
          LIMIT=5; [ "$MODE" = deep ] && LIMIT=15
          python3 scripts/penta_vergence_reconciler.py --repo "$GITHUB_REPOSITORY" --apply --max-mutations "$LIMIT" --output penta-vergence-report.json
          sha256sum penta-vergence-report.json | awk '{print $1}' > report.sha256
      - name: Complete PentaBase job
        if: steps.claim.outputs.claimed == 'true' && success()
        env: {BRIDGE: 'https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/penta-vergence-bridge', JOB_ID: '${{ steps.claim.outputs.job_id }}'}
        run: |
          set -euo pipefail
          jq -n --arg job "$JOB_ID" --arg digest "$(cat report.sha256)" --slurpfile report penta-vergence-report.json '{action:"complete",job_id:$job,evidence_sha256:$digest,report:$report[0]}' > complete.json
          curl -fsSL -H "Authorization: Bearer $(cat oidc.token)" -H 'Content-Type: application/json' --data-binary @complete.json "$BRIDGE" | jq .
      - name: Release failed job
        if: failure() && steps.claim.outputs.claimed == 'true'
        env: {BRIDGE: 'https://tzajnzshmtzjenqulehq.supabase.co/functions/v1/penta-vergence-bridge', JOB_ID: '${{ steps.claim.outputs.job_id }}'}
        run: |
          jq -n --arg job "$JOB_ID" --arg err "PentaVergence worker ${GITHUB_RUN_ID} failed" '{action:"release",job_id:$job,error:$err}' > release.json
          curl -fsSL -H "Authorization: Bearer $(cat oidc.token)" -H 'Content-Type: application/json' --data-binary @release.json "$BRIDGE" | jq .
