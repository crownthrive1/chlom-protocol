name: CHLOM Release Publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/release-requests/chlom-*.json'
  workflow_dispatch:
    inputs:
      request_file:
        description: Committed release request with an exact target SHA
        required: true
        default: .github/release-requests/chlom-core-v1.3.0.json

permissions:
  contents: write

concurrency:
  group: chlom-release-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate committed release request and package
        env:
          EVENT: ${{ github.event_name }}
          REQUEST_INPUT: ${{ inputs.request_file }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_request.py --event "$EVENT" --request "$REQUEST_INPUT" --output "$GITHUB_ENV"

      - name: Publish or reconcile exact GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/$TAG"
          REMOTE_TAG=$(git ls-remote --tags origin "$TAG_REF" "$TAG_REF^{}")
          if [ -z "$REMOTE_TAG" ]; then
            jq -n --arg ref "$TAG_REF" --arg sha "$TARGET" '{ref: $ref, sha: $sha}' > tag-request.json
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input tag-request.json >/dev/null
          fi
          git fetch --no-tags origin "$TAG_REF:$TAG_REF"
          test "$(git rev-parse "$TAG_REF^{commit}")" = "$TARGET"
          METADATA_DRAFT=$DRAFT
          if [ "$NATIVE_ASSET_HANDOFF" = true ]; then
            # Native publication is completed by the verified binary/source asset workflow.
            METADATA_DRAFT=true
          fi
          if gh release view "$TAG" --json tagName,isDraft > existing-release.json 2>/dev/null; then
            # A retry must never retract an already published native release.
            if [ "$NATIVE_ASSET_HANDOFF" = true ] && [ "$(jq -r .isDraft existing-release.json)" = false ]; then
              METADATA_DRAFT=false
            fi
            # Existing tags are never silently moved or reconciled to another source.
            gh release edit "$TAG" --title "$TITLE" --notes-file "$PACKAGE/RELEASE_NOTES.md" --draft="$METADATA_DRAFT" --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes-file "$PACKAGE/RELEASE_NOTES.md" --draft="$METADATA_DRAFT" --prerelease="$PRERELEASE"
          fi
          echo "METADATA_DRAFT=$METADATA_DRAFT" >> "$GITHUB_ENV"

      - name: Verify exact published source and release readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/$TAG"
          git fetch --no-tags origin "$TAG_REF:$TAG_REF"
          test "$(git rev-parse "$TAG_REF^{commit}")" = "$TARGET"
          gh release view "$TAG" --json tagName,name,url,isDraft,isPrerelease,targetCommitish > release-readback.json
          jq -e --arg tag "$TAG" --arg title "$TITLE" --argjson draft "$METADATA_DRAFT" --argjson prerelease "$PRERELEASE" \
            '.tagName == $tag and .name == $title and .isDraft == $draft and .isPrerelease == $prerelease' release-readback.json
          cat release-readback.json
          echo "Exact source commit: $TARGET"
