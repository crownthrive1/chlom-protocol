[package]
name = "pallet-chlom-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
frame-benchmarking = { workspace = true, optional = true }
codec.workspace = true
scale-info.workspace = true
frame-support.workspace = true
frame-system.workspace = true
sp-runtime.workspace = true
chlom-primitives.workspace = true

[features]
default = ["std"]
std = ["frame-benchmarking?/std", "codec/std", "scale-info/std", "frame-support/std", "frame-system/std", "sp-runtime/std", "chlom-primitives/std"]

runtime-benchmarks = ["dep:frame-benchmarking", "frame-benchmarking/runtime-benchmarks", "frame-support/runtime-benchmarks", "frame-system/runtime-benchmarks", "sp-runtime/runtime-benchmarks"]

try-runtime = ["frame-support/try-runtime", "frame-system/try-runtime"]

[dev-dependencies]
sp-io = { workspace = true, features = ["std"] }
