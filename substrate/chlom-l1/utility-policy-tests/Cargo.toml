[package]
name = "chlom-utility-policy-tests"
version.workspace = true
edition.workspace = true
license-file = "../../../LICENSE"
repository.workspace = true
publish = false

[dependencies]
codec = { workspace = true, features = ["std"] }
frame-support = { workspace = true, features = ["std"] }
frame-system = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }
chlom-primitives = { workspace = true, features = ["std"] }
pallet-chlom-utility = { workspace = true, features = ["std"] }
pallet-chlom-policy = { workspace = true, features = ["std"] }
scale-info = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = []

runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
    "pallet-chlom-utility/runtime-benchmarks",
    "pallet-chlom-policy/runtime-benchmarks",
]
